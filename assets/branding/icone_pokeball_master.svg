<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="50%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    
    <linearGradient id="border-grad" x1="80" y1="40" x2="432" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.4)"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)"/>
    </linearGradient>

    <!-- Master Ball Upper Dome (Royal Purple / Violet) -->
    <radialGradient id="upper-dome-grad" cx="210" cy="180" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="40%" stop-color="#6D28D9"/>
      <stop offset="85%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </radialGradient>

    <!-- Lower Dome (Pearl Titanium White) -->
    <radialGradient id="lower-dome-grad" cx="220" cy="310" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F1F5F9"/>
      <stop offset="80%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </radialGradient>

    <!-- Master Ball Magenta Pads -->
    <radialGradient id="magenta-pad-left" cx="160" cy="195" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="65%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>
    <radialGradient id="magenta-pad-right" cx="352" cy="195" r="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="65%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>

    <!-- Glowing Core Center -->
    <radialGradient id="button-glow" cx="256" cy="256" r="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>

    <!-- Ball Drop Shadow -->
    <filter id="ball-shadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambient-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)"/>
  <rect x="24.75" y="24.75" width="462.5" height="462.5" rx="111.25" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Ambient Light Behind Pokéball -->
  <circle cx="256" cy="256" r="175" fill="url(#ambient-purple)"/>

  <!-- THE MASTER BALL (Mefislink Edition) -->
  <g filter="url(#ball-shadow)">
    <!-- Base Outer Sphere Silhouette (Radius 156 at 256, 256) -->
    <clipPath id="ball-clip">
      <circle cx="256" cy="256" r="156"/>
    </clipPath>

    <g clip-path="url(#ball-clip)">
      <!-- UPPER HEMISPHERE: Royal Purple -->
      <path d="M 100 256 A 156 156 0 0 1 412 256 Z" fill="url(#upper-dome-grad)"/>

      <!-- Master Ball Magenta Side Pads -->
      <ellipse cx="168" cy="205" rx="34" ry="26" transform="rotate(-20 168 205)" fill="url(#magenta-pad-left)"/>
      <ellipse cx="344" cy="205" rx="34" ry="26" transform="rotate(20 344 205)" fill="url(#magenta-pad-right)"/>

      <!-- Iconic Master Ball 'M' (Embossed & Crisp White) -->
      <!-- Left Leg, Center V, Right Leg -->
      <path d="M 216 230 L 222 176 L 244 176 L 256 200 L 268 176 L 290 176 L 296 230 L 282 230 L 278 196 L 264 220 L 248 220 L 234 196 L 230 230 Z" 
            fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>

      <!-- LOWER HEMISPHERE: Polished Pearl White -->
      <path d="M 100 256 A 156 156 0 0 0 412 256 Z" fill="url(#lower-dome-grad)"/>

      <!-- Top Dome Specular Highlight -->
      <path d="M 140 160 C 180 125 280 120 340 148 C 300 135 210 135 150 165 Z" fill="#FFFFFF" opacity="0.35"/>

      <!-- DARK MIDDLE SEAM (Band) -->
      <rect x="96" y="244" width="320" height="24" fill="#0F172A"/>
      <line x1="96" y1="244" x2="416" y2="244" stroke="#020617" stroke-width="2"/>
      <line x1="96" y1="268" x2="416" y2="268" stroke="#020617" stroke-width="2"/>
    </g>

    <!-- Outer Rim Outline -->
    <circle cx="256" cy="256" r="156" stroke="#0F172A" stroke-width="5" fill="none"/>

    <!-- POKÉBALL CENTER RELEASE BUTTON -->
    <!-- Outer Black Collar -->
    <circle cx="256" cy="256" r="48" fill="#0F172A" stroke="#020617" stroke-width="2"/>

    <!-- Chrome Outer Ring -->
    <circle cx="256" cy="256" r="38" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>

    <!-- Inner Recessed Black Ring -->
    <circle cx="256" cy="256" r="28" fill="#0A0F1D"/>

    <!-- Glowing Core Center Button -->
    <circle cx="256" cy="256" r="22" fill="url(#button-glow)"/>
    <circle cx="252" cy="252" r="7" fill="#FFFFFF" opacity="0.85"/>

    <!-- 4 QUANTUM ACCOUNT LINK PIPS (Representing the 4 PokeIdle Accounts) -->
    <!-- Top Account #1 -->
    <circle cx="256" cy="216" r="3.5" fill="#38BDF8"/>
    <!-- Bottom Account #2 -->
    <circle cx="256" cy="296" r="3.5" fill="#38BDF8"/>
    <!-- Left Account #3 -->
    <circle cx="216" cy="256" r="3.5" fill="#10B981"/>
    <!-- Right Account #4 -->
    <circle cx="296" cy="256" r="3.5" fill="#10B981"/>
  </g>
</svg>